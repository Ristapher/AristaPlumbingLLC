<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Status | Arista Plumbing LLC</title>
  <meta name="description" content="Payment result for Arista Plumbing LLC." />
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root{
      --blue:#0b3a8f;
      --gold:#d4a019;
      --ink:#101828;
      --muted:#667085;
      --bg:#f6f8fb;
      --card:#ffffff;
      --border:#e6eaf2;
      --shadow:0 10px 30px rgba(16,24,40,.10);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
      line-height:1.5;
    }
    .wrap{max-width:720px;margin:28px auto;padding:0 16px}
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .topbar{height:8px;background:linear-gradient(90deg,var(--blue),var(--gold))}
    .inner{padding:22px}
    .status{
      display:inline-flex;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid var(--border);
      font-weight:800;
      margin-bottom:12px;
      background:#fff;
    }
    h1{margin:0 0 8px;font-size:1.65rem}
    p{margin:0 0 10px}
    .muted{color:var(--muted)}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      text-decoration:none;font-weight:800;border-radius:12px;padding:12px 16px;
      border:1px solid var(--border);
    }
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn.secondary{background:#fff;color:var(--ink)}
    @media (max-width:640px){
      .wrap{margin:16px auto}
      .inner{padding:16px}
      h1{font-size:1.4rem}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar"></div>
      <div class="inner">
        <div class="status" id="status-pill">Checking payment…</div>
        <h1 id="title">Checking payment…</h1>
        <p id="message" class="muted">Please wait a moment.</p>
        <p id="invoice-line"></p>

        <div class="actions">
          <a class="btn primary" href="/">Back to site</a>
          <a class="btn secondary" href="tel:17282263312">Call 728-226-3312</a>
        </div>
      </div>
    </div>
  </div>

<script>
  const STRIPE_PUBLISHABLE_KEY = "REPLACE_WITH_YOUR_PK_KEY";

  const params = new URLSearchParams(location.search);
  const invoice = params.get('invoice');
  const clientSecret = params.get('payment_intent_client_secret');

  const pillEl = document.getElementById('status-pill');
  const titleEl = document.getElementById('title');
  const messageEl = document.getElementById('message');
  const invoiceLineEl = document.getElementById('invoice-line');

  if (invoice) {
    invoiceLineEl.textContent = `Invoice #${invoice}`;
  }

  function setView(pill, title, message) {
    pillEl.textContent = pill;
    titleEl.textContent = title;
    messageEl.textContent = message;
  }

  async function init() {
    if (!STRIPE_PUBLISHABLE_KEY.startsWith('pk_')) {
      setView(
        'Configuration needed',
        'Payment page is not configured',
        'Set your Stripe publishable key in paid.html.'
      );
      return;
    }

    if (!clientSecret) {
      setView(
        'Done',
        'Payment page complete',
        'You can close this page. Arista Plumbing can verify the payment in Stripe.'
      );
      return;
    }

    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
    const result = await stripe.retrievePaymentIntent(clientSecret);
    const status = result?.paymentIntent?.status;

    switch (status) {
      case 'succeeded':
        setView(
          'Paid',
          'Payment received',
          'Thank you. Arista Plumbing has your payment.'
        );
        break;
      case 'processing':
        setView(
          'Processing',
          'Payment is processing',
          'Your bank is still processing the payment. Arista Plumbing can verify it shortly.'
        );
        break;
      case 'requires_payment_method':
        setView(
          'Not paid',
          'Payment was not completed',
          'The card was not accepted or the payment was interrupted. Please try again or request a new link.'
        );
        break;
      default:
        setView(
          'Unknown',
          'Payment status updated',
          status ? `Current status: ${status}` : 'The payment status could not be confirmed from this page.'
        );
        break;
    }
  }

  init().catch((error) => {
    setView('Error', 'Could not check payment', error?.message || String(error));
  });
</script>
</body>
</html>
